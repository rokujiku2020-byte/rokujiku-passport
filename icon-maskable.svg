      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- maskable: 端が切り取られても大丈夫なよう全面を背景色にし、図柄は中央70%に収める -->
  <rect width="512" height="512" fill="url(#gm)"/>
  <g transform="translate(256,256) scale(0.7) translate(-256,-256)">
    <polygon points="256,120 374,188 374,324 256,392 138,324 138,188"
